<main class="mx-auto max-w-250">
  @if (habit()) {
    <div>
      <p class="text-2xl font-bold mb-4">Habit Details</p>
    </div>

    <app-habit-today-status-card
      [status]="todayStatus()"
      (markCompleted)="onMarkCompleted(habit()!.id)"
    />

    <hlm-card class="card-shadow mb-3">
      <hlm-card-header>
        <p hlmCardTitle>Details</p>
      </hlm-card-header>
      <div hlmCardContent class="flex flex-col gap-2">
        <div class="flex gap-2">
          <div class="mt-0.5">
            <ng-icon [name]="habitIcon()" size="20px" />
          </div>
          <div>
            <p class="font-bold">{{ habit()!.name }}</p>
            <p>{{ habit()!.description }}</p>
          </div>
        </div>
        <p><span class="font-bold">Category:</span> No category</p>
        <p class="font-bold">Week frequency:</p>
        <app-habit-week-tracker [enableColors]="false" [frequency]="habit()!.frequency" />
      </div>
    </hlm-card>

    <hlm-card class="card-shadow">
      <hlm-card-header>
        <p hlmCardTitle>History</p>
      </hlm-card-header>
      <div hlmCardContent>
        <app-habit-calendar-tracker
          [frequency]="habit()!.frequency"
          [completedDates]="[]"
          [trackStart]="habit()!.createdAt"
          (dayClicked)="dateSelected.set($event)"
        />
      </div>
    </hlm-card>
  }
</main>

@if (dateSelected() && habit()) {
  <app-responsive-dialog-sheet
    state="open"
    (closedEvent)="dateSelected.set(undefined)"
    #dateInfoDialog
  >
    <app-habit-date-info
      [dateSelected]="dateSelected()!"
      [habit]="habit()!"
      [completedDates]="[]"
    />
  </app-responsive-dialog-sheet>
}
