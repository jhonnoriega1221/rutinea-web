<main class="mx-auto max-w-250">
  <div class="flex items-center justify-between mb-4">
    <p class="text-2xl font-bold mb-4">Habits</p>
    <button hlmBtn (click)="createDialog.open()">
      <ng-icon name="lucidePlus" class="w-5! h-5!" />
      New habit
    </button>
  </div>
  <div>
    <app-habits-list [habits]="habits()" />
  </div>
</main>

<app-responsive-dialog-sheet #createDialog>
  <app-habits-create-form (submitted)="onHabitSubmitted($event)" />
</app-responsive-dialog-sheet>
