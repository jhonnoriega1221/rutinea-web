<main class="mx-auto max-w-250 pb-(--bottom-fab-padding)">
  <header class="mb-5 flex h-[44px] justify-between px-4 sm:h-[36px] sm:px-8">
    <div class="flex gap-2">
      <button hlmBtn variant="ghost" size="icon" appRipple (click)="goBack()">
        <ng-icon name="lucideArrowLeft" class="size-6! sm:size-5!" />
      </button>
      <p class="hidden content-center text-xl font-bold sm:block sm:text-2xl">Manage Habits</p>
    </div>
    <p class="block content-center text-xl font-bold sm:hidden sm:text-2xl">Manage Habits</p>

    <app-fab
      class="absolute flex sm:hidden"
      icon="lucidePlus"
      (click)="createHabitDialog.open()"
      [hasBottomBar]="false"
    />

    <div class="flex gap-2">
      <button
        appRipple
        hlmBtn
        class="hover:bg-primary/80 hidden sm:flex"
        (click)="createHabitDialog.open()"
        size="lg"
      >
        <ng-icon name="lucidePlus" class="h-5! w-5!" />
        New habit
      </button>
      <button
        hlmBtn
        appRipple
        class="text-foreground hover:bg-foreground/10 bg-transparent"
        size="icon"
        [hlmDropdownMenuTrigger]="menu"
        align="end"
      >
        <ng-icon name="lucideEllipsisVertical" class="size-6! sm:size-5!" />
      </button>
      <ng-template #menu>
        <hlm-dropdown-menu sideOffset="2" class="w-50 sm:w-auto">
          <a hlmDropdownMenuItem appRipple routerLink="/settings/categories"> Manage Categories </a>
        </hlm-dropdown-menu>
      </ng-template>
    </div>
  </header>

  @if (habits().length > 0) {
    <section class="mb-3 overflow-x-auto px-4 sm:px-8">
      <app-category-filter-picker
        [categories]="categories()"
        [selectedCategory]="filters().categoryId"
        (changeCategory)="onCategoryFilterChange($event)"
        (clickCreateCategory)="createCategoryDialog.open()"
      />
    </section>
  }
  <section class="px-4 sm:px-8">
    @if (habits().length === 0) {
      <app-data-state
        [image]="'/assets/svg/empty_habits_state.svg'"
        title="Your routine starts here"
        description="Small habits grow into big changes. Create your first one."
        actionBtnText="Create habit"
        (clickAction)="createHabitDialog.open()"
      />
    } @else if (filteredHabits().length === 0) {
      <app-data-state
        [image]="'/assets/svg/empty_search_state.svg'"
        title="No habits found"
        description="Nothing matches your filter. Try a different category."
      />
    } @else {
      <app-habits-list [habits]="filteredHabits()" />
    }
  </section>
</main>

<app-responsive-popup #createHabitDialog>
  @if (createHabitDialog.state() === "open") {
    <app-habits-create-form
      #createHabitForm
      [categories]="categories()"
      (clickNewCategory)="createCategoryDialog.open()"
      (submitted)="onHabitSubmitted($event)"
    />
  }
</app-responsive-popup>

<app-responsive-popup #createCategoryDialog>
  @if (createCategoryDialog.state() === "open") {
    <app-category-upsert-form (submitted)="onCategorySubmitted($event)" />
  }
</app-responsive-popup>
