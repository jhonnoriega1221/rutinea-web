<a [routerLink]="habit()?.id" class="bg-card block rounded-xl border">
  <div class="hover:bg-foreground/5 flex items-center justify-between gap-4 rounded-xl p-2">
    <div class="flex items-center gap-2">
      <div
        class="bg-primary/40 flex aspect-square h-[48px] w-[48px] items-center justify-center rounded-lg text-white"
        [style.backgroundColor]="'var(' + categoryColor() + ')'"
      >
        <ng-icon [name]="habitIcon()" size="24px" />
      </div>

      <div class="flex flex-col gap-1">
        <p class="font-medium">{{ habit()?.name }}</p>
        <div class="h-[20px] w-[171px]">
          @if (
            habit()!.frequencyData.type === "specific_days" ||
            habit()!.frequencyData.type === "everyday"
          ) {
            <app-habit-week-tracker
              [frequency]="habit()?.frequencyData!.days"
              [createdAt]="habit()?.createdAt"
              [completedDates]="habit()?.completedDates"
            />
          }

          @if (habit()!.frequencyData.type === "days_per_week") {
            <app-habit-numeric-tracker
              [completedDates]="habit()!.completedDates"
              [weeklyGoal]="habit()!.frequencyData.count"
            />
          }
        </div>
      </div>
    </div>

    <div
      class="border-foreground/30 mr-1 hidden w-[42px] flex-col items-center border-l-2 pl-2 text-orange-400"
    >
      <ng-icon name="lucideFlame" />
      <span class="font-bold">999</span>
    </div>
  </div>
</a>
