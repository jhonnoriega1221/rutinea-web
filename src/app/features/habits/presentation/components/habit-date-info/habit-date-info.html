<div class="w-full sm:w-100 max-w-full min-w-20 box-border pt-4 flex flex-col gap-3">
  <header class="flex items-start gap-4 px-6">
    <div class="flex flex-col gap-0 justify-center items-center">
      <p class="text-2xl font-medium text-center">{{ dayNumber() }}</p>
      <p class="uppercase text-xs text-center">{{ monthLabel() }}</p>
    </div>
    <div>
      <p class="font-medium mb-1">{{ habit().name }}</p>
      <span
        hlmBadge
        [class]="config().badgeClass"
        class="bg-foreground/40 text-white flex items-center gap-1"
        [class.bg-success]="status() === 'completed'"
        [class.bg-destructive]="status() === 'missed'"
      >
        @if (config().icon) {
          <ng-icon [name]="config().icon" />
        }
        {{ config().badgeLabel }}
      </span>
    </div>
  </header>
  <div class="px-6 mb-4 text-muted-foreground">
    {{ config().description(habit().name) }}
  </div>
  @if (config().footerHint) {
    <footer class="bg-card-foreground/5 px-6 pb-4 pt-2">
      <small class="mb-3 block text-center text-muted-foreground">
        {{ config().footerHint }}
      </small>

      <button
        hlmBtn
        class="w-full"
        (click)="config().action"
        [variant]="config().buttonVariant ?? 'default'"
      >
        Mark as completed
      </button>
    </footer>
  }
</div>
