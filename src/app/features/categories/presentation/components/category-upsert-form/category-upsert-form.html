<form [formRoot]="form" id="form-category-upsert">
  <hlm-field-group class="max-h-[80vh] w-full max-w-full min-w-20 gap-0 sm:max-h-[90vh] sm:w-110">
    <main class="flex flex-1 flex-col gap-4 overflow-y-auto px-4 pt-10 pb-4 sm:pt-5">
      <hlm-field>
        <label hlmFieldLabel for="name">Category name</label>
        <input
          id="name"
          hlmInput
          placeholder="e.g: Priority"
          autocomplete="off"
          [formField]="form.name"
        />
        @for (error of form.name().errors(); track $index) {
          <hlm-field-error [validator]="error.kind">
            {{ error.message }}
          </hlm-field-error>
        }
      </hlm-field>
      <hlm-field>
        <label hlmFieldLabel for="name" class="mb-2">Category color</label>
        <div class="mx-auto max-w-80">
          <app-color-picker id="color" [formField]="form.color" />
        </div>
        @for (error of form.name().errors(); track $index) {
          <hlm-field-error [validator]="error.kind">
            {{ error.message }}
          </hlm-field-error>
        }
      </hlm-field>
    </main>

    <hlm-field
      class="flex shrink-0 justify-end border-t px-4 pt-4 pb-[calc(16px+env(safe-area-inset-bottom))]"
    >
      <button hlmBtn type="submit" form="form-category-upsert" size="lg">
        {{ categoryToEdit() ? "Edit Category" : "Create Category" }}
      </button>
    </hlm-field>
  </hlm-field-group>
</form>
