<main class="mx-auto max-w-250 px-2">
  <p class="mb-4 text-2xl font-bold">Settings</p>

  <p class="mb-2 font-semibold">Appearance</p>
  <section class="card-shadow bg-card mb-6 rounded-xl border px-6 py-3">
    <div hlmCardContent class="flex flex-col justify-between gap-3 sm:flex-row">
      <div class="flex items-center gap-4">
        <ng-icon name="lucideContrast" size="20" class="min-w-5" />
        <div>
          <label>Theme</label>
          <p class="text-foreground/50 text-sm">Set your theme preference</p>
        </div>
      </div>
      <hlm-toggle-group
        class="settings-theme-toggle mx-auto sm:mx-0"
        spacing="1"
        nullable="false"
        variant="outline"
        [(value)]="actualTheme"
        (valueChange)="selectTheme(actualTheme)"
      >
        <button hlmToggleGroupItem value="system" aria-label="Toggle system">
          <ng-icon name="lucideLaptop2" class="mt-0.5 h-4! w-4!" /> System
        </button>
        <button hlmToggleGroupItem value="light" aria-label="Toggle light">
          <ng-icon name="lucideSun" class="mt-0.5 h-4! w-4!" /> Light
        </button>
        <button hlmToggleGroupItem value="dark" aria-label="Toggle dark">
          <ng-icon name="lucideMoon" class="mt-0.5 h-4! w-4!" /> Dark
        </button>
      </hlm-toggle-group>
    </div>
  </section>

  <p class="mb-2 font-semibold">Categories</p>
  <section class="card-shadow bg-card mb-6 rounded-xl border">
    <a
      routerLink="/settings/categories"
      hlmCardContent
      class="hover:bg-foreground/4 flex flex-row items-center justify-between gap-3 rounded-xl px-6 py-3"
    >
      <div class="flex items-center gap-4">
        <ng-icon name="lucideFolderBookmark" size="20" class="min-w-5" />
        <div>
          <p>Manage Categories</p>
          <p class="text-foreground/50 text-sm">View, add, and edit categories for your habits.</p>
        </div>
      </div>
      <ng-icon size="22" name="lucideChevronRight" class="min-w-5" />
    </a>
  </section>

  <p class="mb-2 font-semibold">About</p>
  <section class="card-shadow bg-card rounded-xl border px-6 py-3">
    <div hlmCardContent class="flex flex-col justify-center gap-2 py-4">
      <img
        src="/assets/images/habits_logo.svg"
        alt="Logo"
        class="mx-auto h-24 w-24 object-contain"
      />
      <p class="text-center text-lg font-medium">Rutinea</p>
      <p class="text-foreground/40 text-center text-sm">v{{ version }}</p>

      <p class="mt-3 text-center text-xs">2026 Made By Jhon Noriega</p>
      <p class="text-center text-xs">
        Source code available on
        <a
          href="https://github.com/jhonnoriega/habits"
          target="_blank"
          class="text-blue-600 underline"
          >GitHub</a
        >
      </p>
    </div>
  </section>
</main>
