<div class="mt-2 px-2">
  <p class="text- mb-4 text-sm font-bold">Today's Schedule</p>
</div>
<div class="h-[265px]">
  @if (dueCount() === 0 && completedCount() === 0) {
    <app-data-state
      [image]="'/assets/svg/empty_state.svg'"
      title="Rest day?"
      description="You don't have any habits scheduled for today. Enjoy your downtime."
    />
  } @else if (selectedTab() === "due" && dueCount() === 0 && completedCount() > 0) {
    <app-data-state
      [image]="'/assets/svg/empty_state.svg'"
      title="You're all caught up!"
      description="Awesome work. You've crushed all your pending habits for this day."
    />
  } @else {
    <app-habits-agenda-list
      [habits]="dueHabits()"
      (checkedChange)="onToggleHabitCompletion($event)"
    />
  }
</div>
<div class="px-2">
  <a
    routerLink="/agenda"
    class="text-primary hover:bg-primary/20! flex w-full items-center bg-transparent"
    hlmBtn
    size="lg"
  >
    See all habits
    <ng-icon class="mt-0.5" name="lucideArrowRight" size="20" />
  </a>
</div>
