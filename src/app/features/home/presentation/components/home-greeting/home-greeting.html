<header class="relative flex h-[44px] items-center sm:h-[36px]">
  @if (showGreeting()) {
    <h1
      class="text-foreground animate-greeting absolute inset-0 content-center text-2xl font-bold tracking-tight"
    >
      {{ greeting() }}
    </h1>
  } @else {
    <h1
      class="text-foreground absolute inset-0 content-center text-2xl font-bold tracking-tight capitalize"
      [class.animate-in]="animateDate()"
      [class.fade-in]="animateDate()"
      [class.duration-500]="animateDate()"
    >
      {{ formattedDate() }}
    </h1>
  }
</header>
