<ul>
  @for (habit of habits(); track habit) {
    <li class="hover:bg-foreground/10 flex items-center justify-between rounded-lg py-2 pr-4 pl-2">
      <a class="flex items-center gap-2">
        <div
          class="bg-primary/40 flex aspect-square h-[36px] w-[36px] items-center justify-center rounded-lg text-white"
        >
          <ng-icon [name]="habit.icon" size="16px" />
        </div>
        <p class="text-sm font-medium">{{ habit.name }}</p>
      </a>
      <hlm-checkbox
        class="bg-foreground/20! data-checked:bg-primary! border-foreground/50 h-7 w-7 rounded-full"
      />
    </li>
  }
</ul>
