<ul class="full flex flex-col divide-y">
  @for (habit of habits(); track habit.id) {
    <li class="hover:bg-foreground/10 flex items-center justify-between py-2 pr-6 pl-4">
      <a class="flex items-center gap-2" [class.opacity-30]="habit.dayState === 'completed'">
        <div
          class="bg-primary/40 flex aspect-square h-[36px] w-[36px] items-center justify-center rounded-lg text-white"
        >
          <ng-icon [name]="habit.icon" size="16px" />
        </div>
        <p class="text-sm font-medium" [class.line-through]="habit.dayState === 'completed'">
          {{ habit.name }}
        </p>
      </a>
      <hlm-checkbox
        [checked]="habit.dayState === 'completed'"
        (checkedChange)="checkedChange.emit(habit.id)"
        class="bg-foreground/20! data-checked:bg-primary! border-foreground/50 h-7 w-7 rounded-full"
      />
    </li>
  }

  @for (_ of emptySlots(); track $index) {
    <li class="flex h-[53px] items-center justify-between pr-6 pl-4">
      <div class="flex items-center gap-2 opacity-20">
        <div class="border-foreground/30 h-[36px] w-[36px] rounded-lg border border-dashed"></div>
        <div class="bg-foreground/20 h-3 w-24 rounded-sm"></div>
      </div>
      <div class="border-foreground/30 h-7 w-7 rounded-full border border-dashed opacity-20"></div>
    </li>
  }
</ul>
