<ul class="full flex flex-col divide-y">
  @for (habit of habits(); track habit.id) {
    <li class="flex items-center">
      <a
        [routerLink]="'/habits/' + habit.id"
        class="hover:bg-foreground/10 flex w-full items-center gap-2 py-2 pr-6 pl-4"
        [class.opacaity-30]="habit.dayState === 'completed'"
      >
        <div
          class="bg-primary/40 flex aspect-square h-[36px] w-[36px] items-center justify-center rounded-lg text-white"
          [style.backgroundColor]="'var(' + habit.categoryInfo?.cssVar + ')'"
        >
          <ng-icon [name]="habit.icon" size="16px" />
        </div>
        <p class="text-sm font-medium" [class.line-through]="habit.dayState === 'completed'">
          {{ habit.name }}
        </p>
      </a>
      <hlm-checkbox
        [checked]="habit.dayState === 'completed'"
        (checkedChange)="checkedChange.emit(habit.id)"
        class="bg-foreground/20! data-checked:bg-primary! border-foreground/50 mx-3 h-7 w-7 rounded-full"
      />
    </li>
  }

  @for (_ of emptySlots(); track $index) {
    <li class="flex h-[53px] items-center justify-between pr-6 pl-4"></li>
  }
</ul>
