<main class="mx-auto max-w-400 px-2">
  <header>
    <app-home-greeting />
  </header>
  <div class="grid w-full grid-cols-4 gap-4 sm:grid-cols-8 lg:grid-cols-12">
    <section class="bg-card card-shadow col-span-4 row-span-2 w-full rounded-xl border py-4">
      <app-daily-habits-panel
        [habitsForSelectedDate]="habitsForSelectedDate()"
        [dueCount]="dueCount()"
        [completedCount]="completedCount()"
        (completeHabit)="onCompleteHabit($event)"
      />
    </section>
    <section class="bg-card card-shadow col-span-2 row-span-1 h-40 w-full rounded-xl border p-2">
      <app-kpi-panel title="Pending habits" [value]="dueCount()" icon="lucideCheck" />
    </section>
    <section class="bg-card card-shadow col-span-2 row-span-1 h-40 w-full rounded-xl border p-2">
      <app-kpi-panel title="Completed habits" [value]="completedCount()" icon="lucideClock4" />
    </section>
    <section
      class="bg-card card-shadow col-span-4 row-span-3 h-120 w-full rounded-xl border"
    ></section>
    <section class="bg-card card-shadow col-span-4 row-span-2 h-68 w-full rounded-xl border py-2">
      <div class="mb-2 flex h-[48px] items-center gap-2 px-2">
        <div
          class="bg-primary/20 text-primary! flex aspect-square h-[36px] w-[36px] items-center justify-center rounded-lg text-white"
        >
          <ng-icon name="lucideCheckCircle2" size="18" />
        </div>
        <p class="text-base font-bold">Heatmap</p>
      </div>
      <app-habit-heatmap />
    </section>
    <section
      class="bg-card card-shadow col-span-4 row-span-2 h-80 w-full rounded-xl border"
    ></section>
  </div>
</main>
