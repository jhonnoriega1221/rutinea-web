<div class="relative flex">
  <button
    class="bg-background/50 hover:bg-foreground/10 border-foreground/40 absolute top-1/2 left-0 z-10 hidden h-10 w-10 -translate-y-1/2 items-center justify-center rounded-full border sm:flex"
    [class.sm:hidden]="!canScrollLeft()"
    (click)="scrollByPage(-1)"
  >
    <ng-icon name="lucideArrowLeft" />
  </button>
  <ul
    class="sm:scrollbar-themed flex gap-1 overflow-x-scroll px-4 pb-3"
    #strip
    (scroll)="updateArrows()"
  >
    @for (item of list(); track item.fullDate.toISOString()) {
      <li
        class="hover:bg-foreground/10 hover:border-foreground/10 transition-[transform, color] active:bg-foreground/10 cubic-bezier(0, 0, 0.2, 1) flex flex-col rounded-lg border border-transparent px-1 py-2 duration-200 active:scale-95"
        [class.bg-foreground/10]="item.dateKey === selectedDate()"
        (click)="onClickDay(item)"
      >
        <p class="text-center text-sm font-bold">{{ item.dayInitial }}</p>
        <p class="mb-2 text-center text-xs">{{ item.formattedDate }}</p>
        <div class="mx-auto">
          <app-circular-progress
            [strokeWidth]="10"
            [size]="55"
            [value]="progressMap().get(item.dateKey) ?? 0"
          />
        </div>
      </li>
    }
  </ul>

  <button
    class="bg-background border-foreground/40 absolute top-1/2 right-0 z-10 hidden h-10 w-10 -translate-y-1/2 items-center justify-center rounded-full border sm:flex"
    [class.sm:hidden]="!canScrollRight()"
    (click)="scrollByPage(1)"
  >
    <ng-icon name="lucideArrowRight" />
  </button>
</div>
