<ul class="full flex flex-col divide-y sm:gap-2">
  @for (habit of habits(); track habit.id) {
    <li
      class="sm:bg-card sm:border-border flex items-center bg-transparent sm:rounded-xl sm:border"
      appRipple
    >
      <a
        [routerLink]="'/habits/' + habit.id"
        class="hover:bg-foreground/10 flex w-full items-center gap-3 rounded-tl-xl rounded-bl-xl py-3 pl-4 sm:py-2 sm:pl-2"
        [class.opacity-30]="habit.dayState === 'completed'"
      >
        <div
          class="bg-primary/40 flex aspect-square h-[44px] w-[44px] items-center justify-center rounded-lg text-white"
          [style.backgroundColor]="'var(' + habit.categoryInfo?.cssVar + ')'"
        >
          <ng-icon [name]="habit.icon" size="20px" />
        </div>
        <p
          class="text-sm font-medium sm:text-base"
          [class.line-through]="habit.dayState === 'completed'"
        >
          {{ habit.name }}
        </p>
      </a>
      <div class="py-2 pr-6 pl-3 sm:pr-4">
        <hlm-checkbox
          [checked]="habit.dayState === 'completed'"
          (checkedChange)="checkedChange.emit(habit.id)"
          class="bg-primary/10! data-checked:bg-primary! border-foreground/20 h-7 w-7 rounded-full"
        />
      </div>
    </li>
  }
</ul>
