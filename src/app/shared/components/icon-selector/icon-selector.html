<hlm-popover [state]="state()">
  <button
    class="bg-transparent"
    hlmPopoverTrigger
    hlmBtn
    variant="outline"
    type="button"
    size="icon"
    (click)="state.set('open')"
  >
    <ng-icon [name]="iconSelected().icon"></ng-icon>
  </button>
  <hlm-popover-content *hlmPopoverPortal class="min-w-[276px]">
    <div>
      @for (icon of uiIcons(); track icon.key) {
        <button
          type="button"
          hlmBtn
          class="{{ icon.uiClasses }} active:bg-foreground/10"
          size="icon"
          (click)="select(icon)"
        >
          <ng-icon [name]="icon.icon" size="18" />
        </button>
      }
    </div>
  </hlm-popover-content>
</hlm-popover>
