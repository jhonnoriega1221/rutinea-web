<div
  class="relative flex items-center justify-center"
  [style.width.px]="size()"
  [style.height.px]="size()"
>
  <svg class="h-full w-full -rotate-90" viewBox="0 0 100 100">
    <!-- Background Track -->
    <circle
      cx="50"
      cy="50"
      [attr.r]="radius"
      class="stroke-muted border-foreground/20"
      [style.stroke-width.px]="strokeWidth()"
      fill="transparent"
    />
    <!-- Progress Indicator -->
    <circle
      cx="50"
      cy="50"
      [attr.r]="radius"
      class="stroke-primary transition-all duration-500 ease-in-out"
      [style.stroke-width.px]="strokeWidth()"
      [style.stroke-dasharray]="circumference"
      [style.stroke-dashoffset]="dashOffset()"
      stroke-linecap="round"
      fill="transparent"
    />
  </svg>
  <div class="absolute inset-0 flex items-center justify-center text-xs font-medium">
    {{ value() }}%
  </div>
</div>
