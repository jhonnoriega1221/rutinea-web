<div class="mx-auto max-w-150 px-12 py-6 text-center">
  <img class="mx-auto mb-8 w-30" [src]="image()" />

  <p class="mb-1 text-xl font-bold sm:text-xl">{{ title() }}</p>

  @if (description() !== undefined || description() === "") {
    <p class="text-foreground/60 text-sm">{{ description() }}</p>
  }

  @if (actionBtnText() !== undefined || actionBtnText() === "") {
    <div class="mt-5">
      <button class="px-5 py-6 text-lg" size="lg" hlmBtn (click)="this.clickAction.emit()">
        {{ actionBtnText() }}
      </button>
    </div>
  }
</div>
