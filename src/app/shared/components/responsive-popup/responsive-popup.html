<ng-template #contentTpl>
  <div class="flex max-h-[80vh] flex-col overflow-hidden sm:max-h-[90vh]">
    <!-- Header Fijo (Solo se renderiza si se pasa contenido) -->
    <div class="absolute z-1 mt-9 w-full shrink-0 border-b sm:border-none">
      <ng-content select="[popup-header]" />
    </div>

    <!-- Cuerpo principal con scroll -->
    <div class="flex-1 overflow-x-hidden overflow-y-auto overscroll-contain">
      <ng-content />
    </div>

    <!-- Footer Fijo -->
    <div class="absolute bottom-0 flex shrink-0 justify-end gap-2 border-t">
      <ng-content select="[popup-footer]" />
    </div>
  </div>
</ng-template>

@if (isMobile()) {
  <hlm-drawer [state]="state()" (closed)="handleClosed()" (click)="$event.stopPropagation()">
    <hlm-drawer-content *hlmDrawerPortal class="touch-none gap-3 overflow-hidden p-0">
      <ng-container *ngTemplateOutlet="contentTpl" />
    </hlm-drawer-content>
  </hlm-drawer>
} @else {
  <hlm-dialog [state]="state()" (closed)="handleClosed()">
    <hlm-dialog-content *hlmDialogPortal class="overflow-hidden p-0 sm:max-w-lg">
      <ng-container *ngTemplateOutlet="contentTpl" />
    </hlm-dialog-content>
  </hlm-dialog>
}
